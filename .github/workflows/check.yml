name: Check

on:
  push:
    branches: [ master, "0.2-backports" ]
  pull_request:
    branches: [ master, "0.2-backports" ]

permissions:
  contents: read

jobs:
  # Manual path filter: this workflow has no trigger-level `paths:` (GitHub does
  # not evaluate those reliably), so this job is the authoritative gate.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          code:
            - 'src/**'
            - 'benches/**'
            - 'examples/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - '.github/workflows/check.yml'

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: clippy, rustfmt
    - name: Clippy (all features)
      run: cargo clippy --all-features -- -D warnings
    - name: Clippy (no features)
      run: cargo clippy --no-default-features -- -D warnings
    - name: Clippy (set features)
      run: cargo clippy --features set -- -D warnings
    - name: Clippy (atomic features)
      run: cargo clippy --features atomic -- -D warnings
    - name: Clippy (set and atomic features)
      run: cargo clippy --features "set atomic" -- -D warnings
    - name: Clippy (alloc features)
      run: cargo clippy --features alloc -- -D warnings
    - name: Clippy (set and alloc features)
      run: cargo clippy --features "set alloc" -- -D warnings
    - name: Format
      run: cargo fmt --check