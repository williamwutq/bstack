name: Alloc Fuzz

on:
  push:
    branches: [ master, "0.2-backports" ]
    paths: [ src/alloc/**, src/alloc_fuzz_tests.rs ]
  pull_request:
    branches: [ master, "0.2-backports" ]
    paths: [ src/alloc/**, src/alloc_fuzz_tests.rs ]

permissions:
  contents: read

jobs:
  # Manual path filter: the trigger-level `paths:` above is kept, but GitHub
  # does not evaluate it reliably, so this job is the authoritative gate.
  changes:
    runs-on: ubuntu-latest
    outputs:
      alloc: ${{ steps.filter.outputs.alloc }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          alloc:
            - 'src/alloc/**'
            - 'src/alloc_fuzz_tests.rs'

  fuzz:
    needs: changes
    if: needs.changes.outputs.alloc == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Fuzz tests
      run: cargo test --features "set alloc" -- alloc_fuzz_tests
    - name: Fuzz tests (release)
      run: cargo test --release --features "set alloc" -- alloc_fuzz_tests
