name: Alloc Fuzz

on:
  push:
    branches: [ master ]
    paths: [ src/alloc/**, src/alloc_fuzz_tests.rs, src/alloc_fault_tests.rs, src/alloc_test_common.rs, src/fault.rs ]
  pull_request:
    branches: [ master ]
    paths: [ src/alloc/**, src/alloc_fuzz_tests.rs, src/alloc_fault_tests.rs, src/alloc_test_common.rs, src/fault.rs ]

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Fuzz tests
      run: cargo test --features "set alloc" -- alloc_fuzz_tests
    - name: Fuzz tests (release)
      run: cargo test --release --features "set alloc" -- alloc_fuzz_tests
    - name: Fault fuzz
      run: cargo test --features "set alloc fault-injection" -- alloc_fault_tests
    - name: Fault fuzz (atomic)
      run: cargo test --features "set alloc atomic fault-injection" -- alloc_fault_tests
