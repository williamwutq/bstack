name: DevSkim

on:
  push:
    branches: [ "master", "**backport**" ]
    paths-ignore: ['**.md', '**/Makefile', '.gitignore', '.gitattributes', '**.toml', '**.lock', 'benches/**', 'src/test.rs', 'src/alloc_fuzz/**', 'c/test_*.c']
  pull_request:
    branches: [ "master", "**backport**" ]
    paths-ignore: ['**.md', '**/Makefile', '.gitignore', '.gitattributes', '**.toml', '**.lock', 'benches/**', 'src/test.rs', 'src/alloc_fuzz/**', 'c/test_*.c']

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@v1
        with:
          ignore-globs: "**/.git/**,**/bin/**,benches/**,src/test.rs,src/alloc_fuzz/**,c/test_*.c"

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: devskim-results.sarif
