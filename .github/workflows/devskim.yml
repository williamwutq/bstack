# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "master", "0.2-backports" ]
    paths-ignore: ['**.md', '**/Makefile', '.gitignore', '.gitattributes', '**.toml', '**.lock']
  pull_request:
    branches: [ "master", "0.2-backports" ]
    paths-ignore: ['**.md', '**/Makefile', '.gitignore', '.gitattributes', '**.toml', '**.lock']

jobs:
  # Manual path filter: the trigger-level `paths-ignore:` above is kept, but
  # GitHub does not evaluate it reliably, so this job is the authoritative gate.
  # `some-with-excludes` inverts the ignore list: `scan` is true when at least
  # one changed file is NOT in the ignore set.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      scan: ${{ steps.filter.outputs.scan }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        predicate-quantifier: 'some-with-excludes'
        filters: |
          scan:
            - '**'
            - '!**/*.md'
            - '!**/Makefile'
            - '!.gitignore'
            - '!.gitattributes'
            - '!**/*.toml'
            - '!**/*.lock'

  lint:
    needs: changes
    if: needs.changes.outputs.scan == 'true'
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@v1

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: devskim-results.sarif
