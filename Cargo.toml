[package]
name = "bstack"
version = "0.4.1"
edition = "2024"
authors = ["William Wu <williamwutq@gmail.com>", "Claude <claude@anthropic.com>"]
license = "MIT"
description = "A persistent, fsync-durable binary stack backed by a single file"
readme = "README.md"
changelog = "CHANGELOG.md"
repository = "https://github.com/williamwutq/bstack"
documentation = "https://docs.rs/bstack"
keywords = ["stack", "persistent", "file-backed", "database", "binary"]
include = ["src/**/*", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE", "examples/**/*.rs", ".gitignore"]

[features]
# Enables BStack::set — in-place mutation of existing payload bytes.
set = []
# Enables BStackAllocator trait and BStackSlice for region management.
alloc = []
# Enables atomic compound operations: atrunc, splice, splice_into, try_extend, try_discard,
# and (with set) swap, swap_into, cas.
atomic = []
# Enables BStackGuardedSlice and related hook-based slice abstractions.
guarded = ["alloc"]
# Enables deterministic I/O-fault injection at the BStack API level, for testing
# allocator and downstream error-handling paths. Only takes effect in builds with
# `debug_assertions` on (dev/test); release builds are completely unaffected even
# with the feature enabled. See the `fault` module. Not enabled by default.
fault-injection = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[[example]]
name = "bstack_bytevec"
required-features = ["alloc", "set"]

[[example]]
name = "alloc_basic"
required-features = ["alloc", "set"]

[[example]]
name = "alloc_typed"
required-features = ["alloc", "set"]

[[example]]
name = "custom_alloc"
required-features = ["alloc", "set"]

[[example]]
name = "hashmap"
required-features = ["set"]

[[example]]
name = "atomic_ops"
required-features = ["atomic"]

[[example]]
name = "atomic_race"
required-features = ["atomic"]

[[example]]
name = "move_and_cow"
required-features = ["set", "atomic"]

[[example]]
name = "linked_list"
required-features = ["atomic"]

[[example]]
name = "atomic_linked_list"
required-features = ["set", "atomic"]

[[example]]
name = "checksummed_cache"
required-features = ["set", "atomic"]

[dev-dependencies]
rand = "0.10"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "locked_region"
harness = false

[[bench]]
name = "alloc"
harness = false
required-features = ["alloc", "set", "atomic"]

[package.metadata.docs.rs]
all-features = true
